<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 710" role="img" aria-labelledby="title desc"><title id="title">Meu primeiro portfólio</title><desc id="desc">Representação visual baseada na documentação pública do projeto; não é captura de tela.</desc><rect x="0" y="0" width="1260" height="710" rx="0" fill="#142f30" stroke="none"/><circle cx="1140" cy="70" r="4" fill="#ff9b77"/><text x="70" y="77" font-family="Arial,sans-serif" font-size="15" fill="#b4c8c3" font-weight="400">ARTHUR MOURY / MEU PRIMEIRO PORTFÓLIO</text><path d="M70 112L1190 112" fill="none" stroke="#628180" stroke-width="2" /><rect x="150" y="165" width="960" height="430" rx="10" fill="#f5f7f6" stroke="none"/><text x="190" y="215" font-family="Arial,sans-serif" font-size="24" fill="#142f30" font-weight="600">Arthur Moury</text><text x="840" y="215" font-family="Arial,sans-serif" font-size="15" fill="#142f30" font-weight="400">Início   Sobre   Projetos</text><path d="M190 246L1070 246" fill="none" stroke="#b4c8c3" stroke-width="2" /><text x="190" y="325" font-family="Arial,sans-serif" font-size="39" fill="#142f30" font-weight="400">O começo de uma história.</text><text x="190" y="378" font-family="Arial,sans-serif" font-size="20" fill="#426261" font-weight="400">HTML, CSS e JavaScript para me apresentar.</text><rect x="190" y="425" width="410" height="90" rx="6" fill="#cee0da" stroke="none"/><text x="215" y="463" font-family="Arial,sans-serif" font-size="26" fill="#142f30" font-weight="400">Gaita Hero</text><text x="215" y="493" font-family="Arial,sans-serif" font-size="15" fill="#142f30" font-weight="400">Registro de um projeto de acessibilidade</text><text x="190" y="556" font-family="Arial,sans-serif" font-size="15" fill="#426261" font-weight="400">Representação do portfólio publicado em 2025</text><text x="70" y="665" font-family="Arial,sans-serif" font-size="11" fill="#b4c8c3" font-weight="400">REPRESENTAÇÃO DO PROJETO</text></svg>